name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run build:web
        working-directory: source
        env:
          CI: true
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Update published build
        run: |
          rsync -a --delete --exclude=.git source/dist/ published/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all --force
          if ! git diff --cached --quiet; then
            git commit -m "Deploy web build from $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
